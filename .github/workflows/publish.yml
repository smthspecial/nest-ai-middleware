name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.3.0"
        required: true
        type: string
      publish:
        description: "Publish the verified archives to npm"
        type: boolean
        default: false

env:
  NPM_RELEASE_TAG: ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release-source.outputs.commit }}
    steps:
      - name: Validate the release tag
        run: |
          if [[ ! "$NPM_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Enter a stable release tag such as v0.3.0." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - id: release-source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.20.0 --ignore-scripts
      - run: npm ci
      - run: npm run format:check
      - run: npm exec -- turbo run build typecheck test
      - run: node .github/scripts/npm-release.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/*.tgz
          if-no-files-found: error

  nest11:
    name: Check Node 24 and NestJS 11
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: release
      - name: Install and exercise the packed packages
        run: |
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" --ignore-scripts --no-package-lock --no-audit --no-fund \
            "$GITHUB_WORKSPACE"/release/*.tgz \
            @nestjs/common@11.1.19 @nestjs/core@11.1.19 \
            reflect-metadata@0.2.2 rxjs@7.8.2 pg@8.20.0 mongodb@7.9.0
          cp .github/scripts/check-nest11.mjs "$consumer/check-nest11.mjs"
          node "$consumer/check-nest11.mjs"

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: [verify, nest11]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.20.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: release
      - run: node .github/scripts/npm-release.mjs publish
        env:
          NPM_RELEASE_PUBLISH: ${{ inputs.publish }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_BOOTSTRAP: ${{ secrets.NPM_BOOTSTRAP_TOKEN != '' }}
